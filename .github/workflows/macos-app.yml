name: macOS app

# Builds, tests and (on a version tag) publishes HoRUS Offline macOS Edition for Apple silicon.
#   push to horus-offline-macos   → build + every check, no release
#   push tag offline-macos-v*     → build + every check + GitHub release with the disk image
#
# Signing: without secrets the app is signed ad hoc. With these repository secrets it is signed
# with a Developer ID and notarised, so Gatekeeper opens it without warnings:
#   MACOS_CERT_P12 (base64 .p12), MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY,
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password)
on:
  push:
    branches: [horus-offline-macos]
    tags: ["offline-macos-v*"]
    paths: ["offline/**", ".github/workflows/macos-app.yml", "*.pkl", "*.json", "*.csv", "*.gz"]
  workflow_dispatch:

permissions:
  contents: write

env:
  HORUS_LLM: gemma4-e4b
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  macos:
    runs-on: macos-15          # Apple silicon (arm64)
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "offline[test]" PySide6-Essentials PySide6-Addons onnxruntime tokenizers \
            faster-whisper huggingface_hub qrcode pyinstaller scikit-learn

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/offline-macos-v* ]]; then v="${GITHUB_REF#refs/tags/offline-macos-v}"
          else v=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' offline/horus_app/app.py); fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "::notice title=version::$v"

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-macos-arm64-${{ env.HORUS_LLM }}-${{ hashFiles('offline/scripts/fetch_models.py') }}

      - name: Fetch models (ONNX embeddings, language model, llama.cpp server, Whisper)
        run: |
          set +e
          python offline/scripts/fetch_models.py --dest models --llm "$HORUS_LLM" --embedding onnx --platform mac 2>&1 | tee fetch.log
          s=${PIPESTATUS[0]}
          grep -E "^llama.cpp |^Wrote " fetch.log | sed 's/^/::notice title=models::/'
          [ $s -ne 0 ] && tail -6 fetch.log | sed 's/^/::error title=fetch::/'
          exit $s

      - name: Cache the symptom index
        uses: actions/cache@v4
        with:
          path: seed
          key: seed-${{ hashFiles('*.json', 'offline/horus/dataset.py', 'offline/horus/books.py', 'offline/horus/embeddings.py', 'offline/scripts/build_seed.py', 'offline/scripts/fetch_models.py') }}

      - name: Symptom index for the shipped books (embedded once, reused by the tests and the build)
        run: |
          set +e
          mkdir -p seed
          cp seed/emb_seed_*.npz models/ 2>/dev/null || true
          python offline/scripts/build_seed.py models 2>&1 | tee seed.log
          s=${PIPESTATUS[0]}
          tail -3 seed.log | sed 's/^/::notice title=symptom index::/'
          [ $s -ne 0 ] && tail -12 seed.log | sed 's/^/::error title=symptom index::/' && exit $s
          cp models/emb_seed_*.npz seed/
          exit $s

      - name: Engine, store and app tests
        working-directory: offline
        run: |
          set +e
          python -m pytest -q -rfEs --tb=short -p no:cacheprovider --junitxml=junit.xml > pytest.log 2>&1
          s=$?
          echo "::notice title=pytest exit code::$s"
          grep -E "^(FAILED|ERROR) " pytest.log | head -15 | sed 's/^/::error title=test::/'
          grep -E "^E  " pytest.log | head -10 | sed 's/^/::error title=detail::/'
          grep -E "passed|failed" pytest.log | tail -1 | sed 's/^/::notice title=tests::/'
          tail -5 pytest.log | sed 's/^/::notice title=pytest tail::/'
          # decide from pytest's own result file, so a crash during interpreter shutdown is visible
          python -c "import sys,xml.etree.ElementTree as E;r=E.parse('junit.xml').getroot();t=r if r.tag=='testsuite' else r[0];f=int(t.get('failures'))+int(t.get('errors'));print('::notice title=junit::failures+errors=%d'%f);sys.exit(1 if f else 0)"

      - name: Window test from source
        timeout-minutes: 20
        run: |
          python offline/HoRUS.py --gui-smoke gs-src; s=$?
          python -c "import json;d=json.load(open('gs-src/guismoke.json'));print('::notice title=window (source)::'+str(d.get('detail')))" || true
          exit $s

      - name: Signing certificate (only when the secrets are set)
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$P12" ] || [ -z "$IDENTITY" ]; then
            echo "HORUS_SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::notice title=signing::no Developer ID secrets: signing ad hoc"
            exit 0
          fi
          kc="$RUNNER_TEMP/horus.keychain-db"; kp=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "HORUS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "::notice title=signing::Developer ID"

      - name: Build HoRUS.app
        run: |
          set +e
          python offline/packaging/build_app.py --models models --version "${{ steps.ver.outputs.version }}" \
            --sign "$HORUS_SIGN_IDENTITY" 2>&1 | tee build.log
          s=${PIPESTATUS[0]}
          grep -E "^Built |^Signed " build.log | sed 's/^/::notice title=build::/'
          [ $s -ne 0 ] && grep -iE "error|exception" build.log | tail -10 | sed 's/^/::error title=build::/'
          exit $s

      - name: Every linked library is inside the app or part of macOS
        run: python offline/packaging/check_deps.py dist/HoRUS.app --arch arm64

      - name: Self-test the app (AI required)
        run: |
          set +e
          dist/HoRUS.app/Contents/MacOS/HoRUS --selftest "$PWD/st-app" --require-ai; s=$?
          python offline/packaging/report_selftest.py st-app/selftest.json "app"
          exit $s

      - name: Notarise (only with a Developer ID)
        if: env.HORUS_SIGN_IDENTITY != '-'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent dist/HoRUS.app "$RUNNER_TEMP/HoRUS.zip"
          xcrun notarytool submit "$RUNNER_TEMP/HoRUS.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 2h
          xcrun stapler staple dist/HoRUS.app          # the ticket travels with the app: works offline
          spctl --assess --type execute --verbose dist/HoRUS.app

      - name: Build the disk image
        run: |
          python offline/packaging/build_dmg.py --app dist/HoRUS.app --out installer \
            --version "${{ steps.ver.outputs.version }}" --arch arm64 --sign "$HORUS_SIGN_IDENTITY"
          ls installer | sed 's/^/::notice title=disk image::/'

      - name: Free disk space (the image holds everything from here on)
        run: |
          df -h "$GITHUB_WORKSPACE" | tail -1 | awk '{print "::notice title=disk before::"$4" free"}'
          rm -rf build dist
          df -h "$GITHUB_WORKSPACE" | tail -1 | awk '{print "::notice title=disk after::"$4" free"}'

      - name: Join the parts, install from the image, test the installed app, remove it
        run: |
          set -e
          v="${{ steps.ver.outputs.version }}"; dmg="$RUNNER_TEMP/HoRUS-$v-macOS-arm64.dmg"
          if ls installer/*.dmg.part* > /dev/null 2>&1; then cat installer/HoRUS-*.dmg.part* > "$dmg"
          else cp installer/HoRUS-*.dmg "$dmg"; fi
          want=$(grep " HoRUS-$v-macOS-arm64.dmg$" installer/SHA256SUMS.txt | cut -d' ' -f1)
          [ "$(shasum -a 256 "$dmg" | cut -d' ' -f1)" = "$want" ] || { echo "::error title=dmg::parts do not join"; exit 1; }
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | cut -f3-)
          apps="$RUNNER_TEMP/Applications"; mkdir -p "$apps"
          ditto "$mnt/HoRUS.app" "$apps/HoRUS.app"
          hdiutil detach "$mnt"
          codesign --verify --deep --strict "$apps/HoRUS.app"
          set +e
          "$apps/HoRUS.app/Contents/MacOS/HoRUS" --selftest "$PWD/st-installed" --require-ai; s=$?
          python offline/packaging/report_selftest.py st-installed/selftest.json "installed"
          [ $s -ne 0 ] && exit 1
          "$apps/HoRUS.app/Contents/MacOS/HoRUS" --gui-smoke "$PWD/gs-installed"; s=$?
          python -c "import json;d=json.load(open('gs-installed/guismoke.json'));print('::notice title=window (installed)::'+str(d.get('detail')))"
          [ $s -ne 0 ] && exit 1
          set -e
          data="$HOME/Library/Application Support/HoRUS/data"
          mkdir -p "$data"; echo "patient data must survive removing the app" > "$data/keep-me.txt"
          rm -rf "$apps/HoRUS.app"
          [ -f "$data/keep-me.txt" ] || { echo "::error title=remove::user data was removed"; exit 1; }
          echo "::notice title=remove::app removed, patient data kept"

      - name: Checksums
        run: sed 's/^/::notice title=sha256::/' installer/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/offline-macos-v') || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-macos-v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: HoRUS Offline macOS Edition ${{ steps.ver.outputs.version }}
          make_latest: false        # the Windows Edition keeps the "latest" badge
          files: |
            installer/HoRUS-*.dmg
            installer/HoRUS-*.dmg.part*
            installer/SHA256SUMS.txt
          body_path: offline/packaging/RELEASE_NOTES.md
