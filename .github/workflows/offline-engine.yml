name: Offline engine

on:
  push:
    branches: [horus-offline]
    paths: ["offline/**", "horus3_1_streamlit.py", ".github/workflows/offline-engine.yml"]
  pull_request:
    paths: ["offline/**"]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: offline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install engine, test and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[embeddings,build,test]" onnxruntime tokenizers

      - name: Cache bundled models
        uses: actions/cache@v4
        with:
          path: models
          key: models-emb-${{ runner.os }}-${{ hashFiles('offline/scripts/fetch_models.py') }}

      - name: Fetch models and prove they load with networking off
        run: python scripts/fetch_models.py --dest ../models --no-llm --no-whisper

      - name: Parity and offline tests (including real-model parity)
        shell: bash
        run: |
          set +e
          python -m pytest -q -rfEs --tb=short -p no:cacheprovider 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # surface failures as annotations (job logs aren't always reachable)
          grep -E "^(FAILED|ERROR) " pytest.log | head -15 | sed 's/^/::error title=test::/'
          grep -E "^E  " pytest.log | head -15 | sed 's/^/::error title=detail::/'
          tail -1 pytest.log | sed 's/^/::notice title=summary::/'
          exit $status
